phoenix_recipe: 1
name: codex
harness_versions: ["0.169.0"]
login_modes: [api-key, chatgpt, custom-api-key, custom-oauth, command-auth, local, bedrock, vertex]
routes:
  - versions: "0.169.0"
    login_mode: api-key
    surfaces: &http
      model: [gateway, transcript]
      mcp: [mcp-proxy, transcript]
      cli: [cli-proxy, transcript]
  - versions: "0.169.0"
    login_mode: chatgpt
    surfaces: *http
  - versions: "0.169.0"
    login_mode: custom-api-key
    surfaces: *http
  - versions: "0.169.0"
    login_mode: custom-oauth
    surfaces: *http
  - versions: "0.169.0"
    login_mode: command-auth
    surfaces: *http
  - versions: "0.169.0"
    login_mode: local
    surfaces: *http
  - versions: "0.169.0"
    login_mode: bedrock
    surfaces: &native
      model: [transcript]
      mcp: [mcp-proxy, transcript]
      cli: [cli-proxy, transcript]
  - versions: "0.169.0"
    login_mode: vertex
    surfaces: *native
model:
  setting: model_providers.<active-provider>.base_url (openai_base_url for built-in openai)
  dialect: openai-responses
mcp:
  file: ~/.codex/config.toml
  format: mcp_servers (TOML)
shim: [ls]
transcript_reader:
  command: [node, transcript-reader.ts]
  harness_versions: ["0.169.0"]
clock:
  probe: [codex, --version]
copy_ignored: false
launcher: [node, capture.ts]
limitations:
  - Gateway is explicit HTTP/SSE capture; it disables WebSockets only for the active provider and never changes its authentication or billing route
  - Remote MCP URLs are rewritten only with --reverse-mcp naming servers whose authorization remains valid at a loopback URL
  - Remote OAuth, ChatGPT-bound MCP, managed restrictions, native Bedrock signing and Vertex credentials fall back to transcripts
  - Transcripts are model-visible items, not HTTP exchanges, complete tool catalogs, MCP protocol envelopes, raw CLI streams or filesystem side effects
  - Absolute commands, shell builtins, reset shell PATH, dynamic/plugin MCP servers and direct HTTP calls can bypass live capture
  - Static Linux builds may use the real clock; clock coverage is informational, not a fidelity penalty
