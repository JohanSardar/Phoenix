phoenix_recipe: 1
name: openai-cs-agents-demo
harness_versions: ["bd7bfca0"]
login_modes: [api-key]
routes:
  - versions: "bd7bfca0"
    login_mode: api-key
    surfaces: {model: [transcript], mcp: [transcript]}
transcript_reader:
  command: [node, read-transcript.mjs]
  harness_versions: ["bd7bfca0"]
task_keys: []
copy_ignored: false
resume:
  from_beginning_only: true
  moment: [node, moment.mjs]
  compose: [node, compose.mjs]
  login: [node, login.mjs]
  image: resume.Dockerfile
  command: [python3, /phoenix/recipe/resume.py]
  llm_hosts:
    opencode-go: [opencode.ai]
limitations:
  - "The demo keeps no session, so every replay starts at the first message with the moment's prompt."
  - "The harness is the demo's python-backend folder. Its ChatKit web server does not run; resume.py runs the triage agent once with the prompt."
  - "Phoenix answers every function tool. The guardrail agents and handoffs run in the box against the moment's LLM."
  - "Every agent, the guardrails included, uses the moment's LLM in place of the LLM named in the code. Only OpenCode Go (opencode.ai) is wired up."
